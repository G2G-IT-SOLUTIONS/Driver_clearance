name: Deploy Driver Clearance

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: driver-clearance-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Test server connectivity
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -e

          echo "Checking server configuration..."

          if [ -z "$SERVER_HOST" ]; then
            echo "ERROR: SERVER_HOST secret is empty!"
            exit 1
          fi

          echo "Server: $SERVER_HOST"
          echo "Testing TCP connection to port 22..."

          python3 - "$SERVER_HOST" <<'PY'
          import socket
          import sys

          host = sys.argv[1]

          try:
              connection = socket.create_connection((host, 22), timeout=15)
              print(f"SUCCESS: {host}:22 is reachable.")
              connection.close()
          except Exception as error:
              print(f"ERROR: Cannot connect to {host}:22")
              print(f"Reason: {error}")
              sys.exit(1)
          PY

          echo "Retrieving SSH host key..."

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if ! ssh-keyscan -T 15 -p 22 -H "$SERVER_HOST" > /tmp/known_hosts 2>/tmp/keyscan_error.log; then
            echo "ERROR: ssh-keyscan failed."
            cat /tmp/keyscan_error.log
            exit 1
          fi

          if [ ! -s /tmp/known_hosts ]; then
            echo "ERROR: No SSH host key was returned."
            cat /tmp/keyscan_error.log
            exit 1
          fi

          cat /tmp/known_hosts >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH host key retrieved successfully."

      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e

          echo "Connecting to deployment server..."

          ssh "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail

            cd /home/wubrist/Driver_clearance

            echo "Checking deployment branch..."

            CURRENT_BRANCH=$(git branch --show-current)

            if [ "$CURRENT_BRANCH" != "master" ]; then
              echo "ERROR: Server is not on master branch."
              exit 1
            fi

            echo "Checking for local tracked changes..."

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Server has local tracked changes. Deployment stopped."
              exit 1
            fi

            echo "Fetching latest code..."

            git pull --ff-only origin master

            echo "Building frontend and backend..."

            docker compose -p driver_clearance build backend frontend

            echo "Updating frontend and backend only..."

            docker compose -p driver_clearance up -d --no-deps backend frontend

            echo "Checking application containers..."

            for container in g2g-frontend g2g-backend; do
              STATUS=$(docker inspect -f '{{.State.Status}}' "$container")

              if [ "$STATUS" != "running" ]; then
                echo "ERROR: $container is not running."
                exit 1
              fi

              echo "$container: $STATUS"
            done

            echo "Deployment completed successfully."
          REMOTE
